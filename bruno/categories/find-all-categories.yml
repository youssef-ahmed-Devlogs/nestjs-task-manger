info:
  name: find-all-categories
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:3000/categories?page=2&limit=10
  params:
    - name: page
      value: "2"
      type: query
    - name: limit
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
